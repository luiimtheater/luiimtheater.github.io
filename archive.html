<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="雷音劇坊演出足跡與活動回顧">
<title>演出足跡｜雷音劇坊</title>
<style>
:root{--bg:#090909;--text:#f3efe8;--muted:#99938b;--line:#2a2926;--red:#a51d22;--max:1180px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:auto}
.wrap{width:min(var(--max),calc(100% - 40px));margin-inline:auto}
header{border-bottom:1px solid var(--line)}
.header-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.12em}
.seal{width:31px;height:31px;background:var(--red);display:grid;place-items:center;font-family:"DFKai-SB","BiauKai","標楷體",serif}
.home{font-size:13px;color:#bcb6ad}
.hero{padding:72px 0 48px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.18em;color:#9e9890;margin:0 0 12px}
h1{font-size:clamp(42px,7vw,78px);line-height:1.05;margin:0 0 18px;letter-spacing:-.03em}
.hero p:last-child{max-width:720px;margin:0;color:#bbb5ac;font-size:17px}
.reviews{padding:48px 0 76px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
.section-head h2{font-size:clamp(26px,4vw,40px);margin:0}
.section-head p{margin:0;color:#827d76;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{display:block;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#101010;transition:transform .22s ease,border-color .22s ease}
.card:hover{transform:translateY(-2px);border-color:#49443e}
.image{position:relative;overflow:hidden;aspect-ratio:16/10;background:#151515}
.image img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease,filter .35s ease}
.card:hover .image img{transform:scale(1.025);filter:brightness(.82)}
.view{position:absolute;right:14px;bottom:13px;font-size:11px;letter-spacing:.14em;color:#fff;opacity:0;transform:translateY(3px);transition:.22s ease;background:rgba(0,0,0,.4);padding:5px 8px;border-radius:999px}
.card:hover .view{opacity:1;transform:none}
.body{padding:18px 18px 20px}
.meta{font-size:11px;letter-spacing:.13em;color:#8c867e;margin:0 0 7px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
h3{font-size:clamp(20px,2.4vw,28px);line-height:1.3;margin:0}
.arrow{font-size:16px;color:#aaa39a;line-height:1.5;flex:0 0 auto}
.place{margin:8px 0 0;color:#aaa49a;font-size:13px}
footer{border-top:1px solid var(--line);padding:28px 0 36px;color:#77726b;font-size:12px}
.footer-inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:720px){
  .wrap{width:min(var(--max),calc(100% - 28px))}
  .hero{padding:50px 0 36px}
  .section-head{align-items:flex-start;flex-direction:column;gap:4px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="index.html"><span class="seal">雷</span><span>雷音劇坊</span></a>
    <a class="home" href="index.html">回首頁 ↗</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">PERFORMANCE ARCHIVE</p>
      <h1>演出足跡</h1>
      <p>留下每一次演出、交流與觀眾相遇的現場。點選照片或文字即可進入活動回顧。</p>
    </div>
  </section>

  <section class="reviews">
    <div class="wrap">
      <div class="section-head">
        <h2>活動回顧</h2>
        <p>整張卡片皆可點選</p>
      </div>

      <div class="grid">
        <a class="card" href="review-qingminglong-dadaocheng-2026.html" aria-label="查看《青瞑的龍蛇無青瞑》活動回顧">
          <div class="image">
            <img src="./qingming-banner.webp" alt="《青瞑的龍蛇無青瞑》演出現場">
            <span class="view">VIEW ↗</span>
          </div>
          <div class="body">
            <p class="meta">2026.10.23 · 大稻埕國際藝術節</p>
            <div class="title-row">
              <h3>《青瞑的龍蛇無青瞑》</h3>
              <span class="arrow">↗</span>
            </div>
            <p class="place">思劇場 Thinkers’ Theater</p>
          </div>
        </a>

        <a class="card" href="review-zhubajie-dadaocheng-2026.html" aria-label="查看《豬八戒痟娶某》親子偶戲互動體驗活動回顧">
          <div class="image">
            <img src="./zhubajie-banner.webp" alt="《豬八戒痟娶某》親子偶戲互動體驗">
            <span class="view">VIEW ↗</span>
          </div>
          <div class="body">
            <p class="meta">2026 · 大稻埕國際藝術節</p>
            <div class="title-row">
              <h3>《豬八戒痟娶某》親子偶戲互動體驗</h3>
              <span class="arrow">↗</span>
            </div>
            <p class="place">思劇場 Thinkers’ Theater</p>
          </div>
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 LUI IM THEATER 雷音劇坊</span>
    <span>Traditional Glove Puppetry · Taiwan</span>
  </div>
</footer>
</body>
</html>
